title: Infraestructura Minecraft con Podman rootless y WireGuard
description: Laboratorio de infraestructura con seguridad por capas
theme: jekyll-theme-cayman
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
optional_front_matter:
  enabled: true
readme_index:
  enabled: true
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: true
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
